<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
  <title>IT Ticket Portal</title>
  <style>
    body {
      margin:0; display:flex; justify-content:center; align-items:center; height:100vh;
      background:
        url("bg.png") center/cover no-repeat,
        radial-gradient(900px 500px at 10% 10%, rgba(37,99,235,0.35), transparent 60%),
        radial-gradient(900px 500px at 90% 30%, rgba(16,185,129,0.22), transparent 60%),
        linear-gradient(180deg, #0b1220, #0f172a);
      font-family:'Kanit', sans-serif;
    }
    body::before { content:""; position:fixed; inset:0; background:rgba(255,255,255,0.72); z-index:-1; backdrop-filter: blur(6px); }
    .card { background:#fff; padding:40px 30px; border-radius:16px; width:330px; box-shadow:0 10px 30px rgba(0,0,0,0.12); text-align:center; border:1px solid #eef2ff; }
    h2 { font-weight: 500; color: #1e293b; margin-bottom: 22px; letter-spacing:0.2px; }
    .sub { color:#64748b; font-size:12px; margin-top:-14px; margin-bottom:18px; }
    input { width:100%; padding:12px; margin:8px 0; border:1px solid #e2e8f0; border-radius:10px; box-sizing:border-box; background: #f8fafc; font-family:'Kanit', sans-serif; font-size:14px; }
    input:focus{ outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,0.12); }
    button { width:100%; padding:12px; margin-top:15px; background:#2563eb; color:white; border:none; border-radius:10px; cursor:pointer; font-weight: 500; font-family:'Kanit', sans-serif; font-size:16px; transition:0.2s; }
    button:hover { background:#1d4ed8; transform: translateY(-1px); }
    button.outline { background:transparent; border:1px solid #2563eb; color:#2563eb; margin-top: 10px; }
    button.outline:hover { background: #eff6ff; }
    a{ color:#2563eb; text-decoration:none; font-size:13px; }
    a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0;">IT Ticket Portal</h2>
    <div class="sub">Sign in เพื่อสร้างและติดตาม Ticket</div>

    <input id="name" placeholder="Name (Register only)">
    <input id="email" placeholder="Email Address">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Sign In</button>
    <button class="outline" onclick="register()">Create Account</button>

    <p id="msg" style="color:#ef4444; font-size:13px; margin:14px 0 0;"></p>
    <p style="margin-top:14px;">
      <a href="/">← กลับไปหน้าเลือกระบบ</a>
    </p>
    <div id="buildInfo" style="color:#64748b;font-size:11px;margin-top:10px;opacity:.85">Build: -</div>
  </div>

  <script>
    async function loadBuildInfo(){
      try{
        const r = await fetch("/it/api/version", { cache: "no-store" });
        const j = await r.json();
        const el = document.getElementById("buildInfo");
        if(el){
          const t = (j.build_time||"").slice(0,19).replace("T"," ");
          el.innerText = `Build: ${j.build_id || "-"}${t?` (${t})`:""}`;
        }
      }catch{}
    }

    loadBuildInfo();

    const params = new URLSearchParams(location.search || "");
    const nextUrl = params.get("next") || "/it";
    const adminOnly = (params.get("adminonly")==="1" || params.get("admin")==="1");
    if(adminOnly){
      const nameEl = document.getElementById("name");
      if(nameEl) nameEl.style.display = "none";
      const btnReg = document.querySelector("button.outline");
      if(btnReg) btnReg.style.display = "none";
      const sub = document.querySelector(".sub");
      if(sub) sub.innerText = "Admin sign in (Equipment Return)";
    }
    if(localStorage.getItem("token")) location.href = nextUrl;

    async function safeJson(r){
      const t = await r.text();
      try { return JSON.parse(t); } catch { return { error: t || "Server error" }; }
    }
    async function login() {
      try{
        const email=document.getElementById("email").value, password=document.getElementById("password").value;
        const r = await fetch("/it/api/login", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({email,password})
        });
        const d = await safeJson(r);
        if(!r.ok) return document.getElementById("msg").innerText = d.error || d.detail || "Login failed";
        localStorage.setItem("token", d.token);
        location.href = nextUrl;
      }catch(e){
        document.getElementById("msg").innerText = "Network error: " + (e?.message || e);
      }
    }

    async function register() {
      const name=document.getElementById("name").value,
            email=document.getElementById("email").value,
            password=document.getElementById("password").value;

      const r = await fetch("/it/api/register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,email,password})
      });

      if(r.ok) {
        document.getElementById("msg").style.color = "#16a34a";
        document.getElementById("msg").innerText = "Registered! Now Sign In.";
      } else {
        const j = await r.json().catch(()=>({}));
        document.getElementById("msg").style.color = "#ef4444";
        document.getElementById("msg").innerText = j.error || "Register failed";
      }
    }
  </script>
</body>
</html>
